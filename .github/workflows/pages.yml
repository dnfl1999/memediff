name: Verify and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      forks_step_outcome: ${{ steps.forks_refresh.outcome }}
      forks_diagnostic: ${{ steps.forks_refresh.outputs.diagnostic }}
      unit_qa: ${{ steps.qa.outputs.unit }}
      pre_deploy_qa: ${{ steps.qa.outputs.preDeploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests
        id: unit
        run: |
          mkdir -p qa-results
          npm run test:qa
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Chromium desktop and mobile E2E (mock API)
        id: pre_deploy
        run: npm run test:e2e
        env:
          QA_RUN: linux-build-mock
      - name: Collect pre-deployment QA diagnostics
        id: qa
        if: always() && steps.unit.outcome != ''
        continue-on-error: true
        run: node scripts/collect-qa-diagnostic.mjs verify
        env:
          QA_UNIT_OUTCOME: ${{ steps.unit.outcome }}
          QA_PREDEPLOY_OUTCOME: ${{ steps.pre_deploy.outcome }}
      - name: Prepare exact-mint index and report verification health
        id: forks_refresh
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/update-forks-index.mjs dist/data/forks-index.json
        env:
          ALLOW_DEPLOYED_FALLBACK: ${{ github.event_name != 'schedule' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-build
          path: qa-results/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  diagnostics:
    if: always() && github.repository == 'dnfl1999/memediff' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    needs: [verify, deploy, public-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and validate operation diagnostic
        id: record
        run: node scripts/write-index-diagnostic.mjs
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PUBLIC_QA_RESULT: ${{ needs.public-qa.result }}
          FORKS_STEP_OUTCOME: ${{ needs.verify.outputs.forks_step_outcome }}
          FORKS_DIAGNOSTIC: ${{ needs.verify.outputs.forks_diagnostic }}
          QA_UNIT: ${{ needs.verify.outputs.unit_qa }}
          QA_PREDEPLOY: ${{ needs.verify.outputs.pre_deploy_qa }}
          QA_PUBLICMOCK: ${{ needs.public-qa.outputs.mock_qa }}
          QA_PUBLICLIVE: ${{ needs.public-qa.outputs.live_qa }}
      - name: Upload Pages diagnostic JSON
        id: diagnostic_upload
        uses: actions/upload-artifact@v4
        with:
          name: pages-index-diagnostic-attempt-${{ github.run_attempt }}
          path: diagnostics/index-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Report diagnostic upload result
        if: always()
        shell: bash
        env:
          RECORD_RESULT: ${{ steps.record.outcome }}
          UPLOAD_RESULT: ${{ steps.diagnostic_upload.outcome }}
        run: |
          message="Diagnostic recording: ${RECORD_RESULT:-unavailable}. Artifact upload: ${UPLOAD_RESULT:-unavailable}."
          printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          if [ "$UPLOAD_RESULT" != 'success' ]; then
            printf '::warning::%s\n' "$message"
          fi
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  public-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mock_qa: ${{ steps.qa.outputs.publicMock }}
      live_qa: ${{ steps.qa.outputs.publicLive }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Public Pages desktop and mobile E2E (mock API)
        id: public_mock
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://dnfl1999.github.io/memediff/
          QA_RUN: linux-public-mock
      - name: Public Pages real GitHub API and downloads (no retries)
        id: public_live
        if: success() || failure()
        run: npm run test:e2e:live
        env:
          E2E_BASE_URL: https://dnfl1999.github.io/memediff/
          QA_RUN: linux-public-live
      - name: Collect public QA diagnostics
        id: qa
        if: always() && steps.public_mock.outcome != ''
        continue-on-error: true
        run: node scripts/collect-qa-diagnostic.mjs publicQA
        env:
          QA_PUBLICMOCK_OUTCOME: ${{ steps.public_mock.outcome }}
          QA_PUBLICLIVE_OUTCOME: ${{ steps.public_live.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-public
          path: qa-results/
          retention-days: 14
